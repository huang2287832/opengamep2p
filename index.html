<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>opengamep2p · 联机实验场</title>
<style>
  :root{font-family:system-ui,sans-serif;color:#e5edf6;background:#0c1420}*{box-sizing:border-box}body{max-width:1000px;margin:48px auto;padding:0 24px}header{display:flex;align-items:center;gap:14px}.mark{background:#a2f3ba;color:#10251b;border-radius:14px;padding:12px;font-weight:800}h1{font-size:28px;margin:0}header p{margin:4px 0;color:#8c9daf}.tag{color:#a2f3ba;font-size:12px;letter-spacing:2px}main{display:grid;grid-template-columns:280px 1fr;gap:20px;margin-top:32px}.panel{background:#14202f;border:1px solid #27374b;border-radius:16px;padding:22px}h2{font-size:18px;margin:0 0 18px}button{cursor:pointer;border:0;border-radius:8px;padding:12px 16px;font:inherit;font-weight:600;background:#a2f3ba;color:#10251b;width:100%;margin-bottom:12px}button.secondary{background:#27374b;color:#e5edf6}button:disabled{opacity:.4;cursor:default}textarea{width:100%;height:94px;background:#0c1420;border:1px solid #34465b;border-radius:8px;color:#dce9f7;padding:10px;resize:vertical;font:12px monospace}label{display:block;font-size:13px;color:#9baec4;margin:12px 0 8px}.muted{font-size:13px;line-height:1.7;color:#9baec4}canvas{display:block;width:100%;aspect-ratio:1;background:#0b1521;border-radius:12px;touch-action:none}.stats{display:flex;justify-content:space-between;gap:8px;margin-bottom:16px;font-size:13px}#status{color:#a2f3ba}#message{min-height:24px;color:#ffbb90;font-size:13px;overflow-wrap:anywhere}footer{margin-top:24px;color:#7e94ad;font-size:13px;line-height:1.8}.pad{display:flex;justify-content:center;gap:6px;margin-top:12px}.pad button{width:48px;margin:0;touch-action:none}@media(max-width:740px){body{margin-top:24px}main{grid-template-columns:1fr}.panel{padding:18px}}
</style>
<style>
  input[type=text]{width:100%;background:#0c1420;border:1px solid #34465b;border-radius:8px;color:#dce9f7;padding:10px;font:inherit}.visibility{display:flex;align-items:center;gap:8px;margin:12px 0 16px;color:#dce9f7}.lobby{margin-top:20px}.lobby-header{display:flex;align-items:center;justify-content:space-between;gap:12px}.lobby-header h2{margin-bottom:8px}.lobby-header button{width:auto;margin:0}.room-card{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid #27374b;padding:16px 0}.room-card h3{font-size:16px;margin:0 0 5px;overflow-wrap:anywhere}.room-card p{margin:0;color:#9baec4;font-size:13px}.room-card button{width:auto;min-width:88px;margin:0;flex-shrink:0}#lobby-status{margin:0 0 16px}.room-card:last-child{padding-bottom:0}
</style>
<header><div class="mark">P2P</div><div><div class="tag">OPEN SOURCE / MULTIPLAYER</div><h1>opengamep2p</h1><p>一个玩家做主机，朋友直接加入。</p></div></header>
<main><section class="panel"><h2>联机实验场</h2><label for="room-name">房间名称</label><input id="room-name" type="text" maxlength="80" value="一起玩"><label class="visibility"><input id="public-room" type="checkbox" checked> 在公开大厅显示</label><button id="host">创建房间</button><label for="invite">邀请代码</label><textarea id="invite" placeholder="粘贴朋友发来的邀请代码"></textarea><button id="join" class="secondary" style="margin-top:12px">加入房间</button><button id="copy" class="secondary" disabled>复制邀请</button><button id="leave" class="secondary" disabled>离开房间</button><p class="muted">用方向键或 WASD 移动。手机可用下方按钮。取消公开后，仅凭邀请代码加入。</p><p id="message" role="alert"></p></section>
<section class="panel"><div class="stats"><span id="status" role="status">等待连接</span><span id="players">0 / 8 玩家</span></div><canvas id="arena" width="600" height="600" aria-label="多人移动游戏"></canvas><div class="pad"><button data-key="ArrowLeft" class="secondary">←</button><button data-key="ArrowUp" class="secondary">↑</button><button data-key="ArrowDown" class="secondary">↓</button><button data-key="ArrowRight" class="secondary">→</button></div><p class="muted">绿色光圈是你。主机运行游戏逻辑，其他玩家接收统一状态。</p></section></main>
<section class="panel lobby" aria-label="公开房间大厅"><div class="lobby-header"><h2>公开房间大厅</h2><button id="retry-lobby" class="secondary">重新连接</button></div><p id="lobby-status" class="muted" role="status">正在连接大厅…</p><div id="rooms" aria-live="polite"><p class="muted">正在获取公开房间。</p></div><p class="muted">显示当前游戏的公开房间，人数自动更新。离线房间通常在 35 秒内移除。</p></section>
<footer>无需部署游戏服务器。大厅借助公共 Nostr relay 发布房间信息；游戏通过 WebRTC 联机，部分网络需要配置 TURN。请用不同浏览器窗口或设备测试。</footer>
<script type="module" src="/examples/arena.js"></script>
</html>
